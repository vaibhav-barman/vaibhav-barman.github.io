<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--theme-->
    <!--seo-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font-sans); }
      a { color: var(--accent); text-decoration: none; }
      a:hover, a:focus-visible { text-decoration: underline; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .resume { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font: 14px var(--font-mono); }
      .toolbar button { font: inherit; font-weight: 600; color: var(--bg); background: var(--accent); border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
      header h1 { margin: 0; font-size: 2.25rem; letter-spacing: -0.02em; }
      .role { margin: 4px 0 8px; color: var(--accent); font-weight: 600; }
      .contact { margin: 0; color: var(--muted); font-size: 14px; }
      h2 { margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font: 600 13px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
      h3 { margin: 0; font-size: 16px; }
      .entry { margin-bottom: 14px; }
      .row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap; }
      .row > span { color: var(--muted); font-size: 13px; }
      .sub { color: var(--muted); }
      p { margin: 4px 0; }
      ul { margin: 4px 0 0; padding-left: 18px; }
      li { margin: 2px 0; }
      @media print {
        :root { --bg: #fff; --text: #111; --muted: #444; --accent: #0b5d2a; --line: #ccc; }
        @page { margin: 14mm; }
        body { font-size: 10.5pt; }
        .resume { padding: 0; max-width: none; }
        .no-print { display: none !important; }
        .entry { break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <!--resume-->
    <script type="module" src="/src/resume.js"></script>
  </body>
</html>
