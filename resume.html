<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!--theme-->
    <!--seo-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; }
      a { color: var(--text); text-decoration-color: var(--line-hi); text-underline-offset: 3px; }
      a:hover, a:focus-visible { color: var(--white); text-decoration-color: var(--white); }
      :focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
      ::selection { background: var(--white); color: var(--bg); }
      .resume { max-width: 820px; margin: 0 auto; padding: 28px 20px 72px; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 36px; font: 400 11px var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; }
      .toolbar a { display: inline-flex; align-items: center; min-height: 44px; color: var(--mid); text-decoration: none; }
      .toolbar button { min-height: 44px; padding: 12px 16px; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--text); background: rgba(0, 0, 0, 0.5); border: 1px solid var(--line-hi); border-radius: 3px; cursor: pointer; }
      .toolbar button:hover { border-color: var(--white); background: #111; }
      header h1 { margin: 0; font: 200 clamp(32px, 9vw, 52px) / 1.05 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
      .role { margin: 12px 0 8px; color: var(--mid); font: 400 12px var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; }
      .contact { margin: 0; color: var(--mid); font-size: 14px; overflow-wrap: anywhere; }
      h2 { margin: 34px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line2); font: 400 11px var(--font-mono); letter-spacing: 0.28em; text-transform: uppercase; color: var(--text); }
      h3 { margin: 0; font-size: 16px; font-weight: 600; }
      .entry { margin-bottom: 16px; }
      .row { display: flex; justify-content: space-between; gap: 4px 16px; align-items: baseline; flex-wrap: wrap; }
      .row > span { color: var(--mid); font-size: 13px; }
      .sub { color: var(--mid); }
      p { margin: 4px 0; }
      ul { margin: 4px 0 0; padding-left: 18px; }
      li { margin: 2px 0; }
      li::marker { color: var(--mid); }
      @media print {
        :root { --bg: #fff; --text: #111; --mid: #444; --white: #000; --line2: #ccc; --line-hi: #999; }
        @page { margin: 14mm; }
        body { font-size: 10.5pt; }
        .resume { padding: 0; max-width: none; }
        .no-print { display: none !important; }
        .entry { break-inside: avoid; }
        header h1 { background: none; color: #000; -webkit-text-fill-color: #000; font-size: 28pt; }
        a { text-decoration: none; }
      }
    </style>
  </head>
  <body>
    <!--resume-->
    <script type="module" src="/src/resume.js"></script>
  </body>
</html>
