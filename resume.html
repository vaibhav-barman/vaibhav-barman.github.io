<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05060a" />
    <!--seo-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #05060a; --fg: #e6f1ff; --muted: #8b97ad; --accent: #00e5ff; --accent2: #a78bfa; --line: rgba(0, 229, 255, 0.18); }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      a { color: var(--accent); text-decoration: none; }
      a:hover, a:focus-visible { text-decoration: underline; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .resume { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: 13px; }
      .toolbar button { font: inherit; color: var(--bg); background: var(--accent); border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
      header h1 { margin: 0; font-size: 2.1rem; letter-spacing: -0.02em; }
      .role { margin: 4px 0 8px; color: var(--accent2); font-weight: 600; }
      .contact { margin: 0; color: var(--muted); font-size: 13px; }
      h2 { margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-family: ui-monospace, 'JetBrains Mono', monospace; }
      h3 { margin: 0; font-size: 15px; }
      .entry { margin-bottom: 14px; }
      .row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap; }
      .row > span { color: var(--muted); font-size: 12.5px; }
      .sub { color: var(--muted); }
      p { margin: 4px 0; }
      ul { margin: 4px 0 0; padding-left: 18px; }
      li { margin: 2px 0; }
      @media print {
        :root { --bg: #fff; --fg: #111; --muted: #555; --accent: #0b5cad; --accent2: #333; --line: #ccc; }
        @page { margin: 14mm; }
        body { font-size: 10.5pt; }
        .resume { padding: 0; max-width: none; }
        .no-print { display: none !important; }
        .entry { break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <!--resume-->
    <script>
      document.getElementById('print').addEventListener('click', function () { window.print() })
      if (new URLSearchParams(location.search).has('print')) window.addEventListener('load', function () { setTimeout(function () { window.print() }, 300) })
    </script>
  </body>
</html>
