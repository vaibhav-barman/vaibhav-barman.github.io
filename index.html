<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <!--seo-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      document.documentElement.classList.add('js')
    </script>
    <style>
      html { background: #05060a; color: #e6f1ff; }
      .static-content { max-width: 760px; margin: 0 auto; padding: 48px 20px; font: 16px/1.6 system-ui, sans-serif; }
      .static-content a { color: #00e5ff; }
      .static-content h1 { font-size: 2.4rem; margin: 0 0 .5rem; }
      .static-content h2 { margin-top: 2.5rem; font-size: 1.5rem; color: #a78bfa; }
      .static-content h3 { font-size: 1.1rem; margin: 1.5rem 0 .25rem; }
      .static-content ul { padding-left: 1.2rem; }
      .js .static-content { display: none; }
      .boot { display: none; }
      .js .boot { display: flex; position: fixed; inset: 0; z-index: 70; align-items: center; justify-content: center; background: #05060a; }
      .boot p { width: min(360px, 80vw); margin: 0; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8b97ad; }
      .boot b { color: #00e5ff; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" aria-hidden="true"><p><b>&gt; booting portfolio.sh</b><br />compiling shaders · sampling latent space</p></div>
    <div id="root"><!--static-content--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
